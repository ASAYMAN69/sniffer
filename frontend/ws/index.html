<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Re-use existing CSS -->
    <link rel="stylesheet" href="../css/_variables.css">
    <link rel="stylesheet" href="../css/_base.css">
    <link rel="stylesheet" href="../css/_header.css">
    <link rel="stylesheet" href="../css/_dashboard.css">
    <link rel="stylesheet" href="../css/_toggles.css">
    <link rel="stylesheet" href="../css/_responsive.css">
    <!-- New chat CSS -->
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="../css/_switch.css">
</head>
<body class="light ws-page">
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo" style="display: flex; align-items: center;">
                    <svg class="logo-icon" viewBox="0 0 32 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M26,2,24.59,3.41,27.17,6H22.315A6.9835,6.9835,0,0,0,9.08,10H4.83L7.41,7.41,6,6,1,11l5,5,1.41-1.41L4.83,12H9.685A6.9835,6.9835,0,0,0,22.92,8h4.25l-2.58,2.59L26,12l5-5ZM21,9a4.983,4.983,0,0,1-8.9745,3H16V10H11.1011a4.9852,4.9852,0,0,1,8.8734-4H16V8h4.8989A5.0019,5.0019,0,0,1,21,9Z" transform="translate(0 0)"/>
                    </svg>
                    <span>Sniffer</span>
                    <div class="view-switch">
                        <div class="switch-highlight"></div>
                        <a href="/" class="switch-option">API</a>
                        <a href="/ws/index.html" class="switch-option active">WS</a>
                    </div>
                </div>
                <div class="controls">
                    <label class="switch" id="dark-mode-switch-label">
                        <input id="dark-mode-toggle-input" type="checkbox" />
                        <div class="slider round">
                            <div class="sun-moon">
                                <svg id="moon-dot-1" class="moon-dot" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="moon-dot-2" class="moon-dot" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="moon-dot-3" class="moon-dot" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="light-ray-1" class="light-ray" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="light-ray-2" class="light-ray" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="light-ray-3" class="light-ray" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="cloud-1" class="cloud-dark" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="cloud-2" class="cloud-dark" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="cloud-3" class="cloud-dark" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="cloud-4" class="cloud-light" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="cloud-5" class="cloud-light" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                                <svg id="cloud-6" class="cloud-light" viewBox="0 0 100 100"> <circle cx="50" cy="50" r="50"></circle> </svg>
                            </div>
                            <div class="stars">
                                <svg id="star-1" class="star" viewBox="0 0 20 20"> <path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path> </svg>
                                <svg id="star-2" class="star" viewBox="0 0 20 20"> <path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path> </svg>
                                <svg id="star-3" class="star" viewBox="0 0 20 20"> <path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path> </svg>
                                <svg id="star-4" class="star" viewBox="0 0 20 20"> <path d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"></path> </svg>
                            </div>
                        </div>
                    </label>
                    <button class="btn btn-danger" id="clearBtn">
                        <i class="fas fa-trash-alt"></i> Clear All
                    </button>
                    <button class="btn btn-gray" id="newReqBtn">
                        <i class="fas fa-plus"></i> New Request
                    </button>
                    <button class="btn btn-outline" id="statsToggleBtn">
                        <i class="fas fa-chart-bar"></i> Statistics
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="display: grid; grid-template-columns: 400px 1fr; gap: 20px; height: calc(100vh - 80px - 2rem); padding: 2rem 0;">
        <div class="table-container" style="display: flex; flex-direction: column;">
            <div class="table-header">
                <div class="table-title">Requests</div>
            </div>
            <div class="table-responsive" style="flex-grow: 1; overflow-y: auto;">
                <table id="requestTable" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>URL</th>
                        </tr>
                    </thead>
                    <tbody id="requestTableBody">
                        <!-- Request items will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="table-container chat-container">
            <div class="table-header">
                <div class="table-title" id="chatHeader">Select a request</div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Chat messages will be populated by JavaScript -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
